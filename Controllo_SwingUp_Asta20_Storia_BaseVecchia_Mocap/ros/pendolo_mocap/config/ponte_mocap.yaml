# Parametri di ponte_mocap. Vettori con il punto decimale (0.0, non 0):
# ROS 2 rifiuta un vettore di interi dove si aspetta dei double.
ponte_mocap:
  ros__parameters:
    porta: /dev/ttyACM0          # ST-LINK della Nucleo (ls /dev/ttyACM* /dev/serial/by-id/)
    baud: 115200
    # PoseStamped del corpo rigido sull'asta (vrpn_mocap: /vrpn_mocap/<nome>/pose).
    topic_posa: /vrpn_mocap/pendolo/pose
    # Verticale verso l'alto nel sistema del tracciamento: z se il driver
    # converte in ROS (vrpn_mocap con Motive "Up axis Z"), y per Motive in Y-up.
    asse_su: [0.0, 0.0, 1.0]
    # Binario del carrello verso il finecorsa DESTRO guardando il banco da dietro
    # (+x del firmware). Verso sbagliato = angolo con il segno opposto.
    asse_carrello: [1.0, 0.0, 0.0]
    # Direzione dell'asta nel sistema del corpo rigido; tutti zero = calibrazione
    # all'avvio con il pendolo fermo appeso (il nodo stampa il valore da mettere qui).
    direzione_corpo: [0.0, 0.0, 0.0]
    campioni_calibrazione: 200   # 1 s a 200 Hz
    dispersione_max_gradi: 1.0   # pendolo considerato fermo durante la calibrazione
    pose_ripetute_max: 10        # pose identiche di fila = corpo rigido perso (0 = mai)
    fuori_piano_max_gradi: 15.0  # avviso se l'asta esce dal piano di oscillazione
